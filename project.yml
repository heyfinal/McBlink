name: McBlink
options:
  bundleIdPrefix: com.heyfinal
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  McBlinkApp:
    type: application
    platform: macOS
    bundleIdPrefix: com.heyfinal
    bundleId: com.heyfinal.mcblink
    deploymentTarget: "14.0"
    sources:
      - path: Sources/McBlinkApp
        type: group
      - path: Sources/Shared
        type: group
    entitlements:
      path: Entitlements/McBlinkApp.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: McBlink
        INFOPLIST_FILE: Sources/McBlinkApp/Info.plist
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
      - target: SentinelCore
        embed: true
    info:
      path: Sources/McBlinkApp/Info.plist
      properties:
        CFBundleDisplayName: McBlink
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "McBlink needs camera access for live monitoring."
        NSMicrophoneUsageDescription: "McBlink needs microphone access for two-way audio."
        NSXPCConnectionsAllowed: true
        XPCService:
          ServiceType: Application

  SentinelCore:
    type: xpc-service
    platform: macOS
    bundleId: com.heyfinal.mcblink.sentinelcore
    deploymentTarget: "14.0"
    sources:
      - path: Sources/SentinelCore
        type: group
      - path: Sources/Shared
        type: group
    entitlements:
      path: Entitlements/SentinelCore.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: SentinelCore
        INFOPLIST_FILE: Sources/SentinelCore/Info.plist
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Sources/SentinelCore/Info.plist
      properties:
        CFBundleDisplayName: SentinelCore
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        XPCService:
          ServiceType: Application
          EnvironmentVariables: {}

  SentinelWatchdog:
    type: tool
    platform: macOS
    bundleId: com.heyfinal.mcblink.watchdog
    deploymentTarget: "14.0"
    sources:
      - path: Sources/SentinelWatchdog
        type: group
      - path: Sources/Shared
        type: group
    settings:
      base:
        PRODUCT_NAME: SentinelWatchdog
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  McBlinkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/McBlinkTests
      # Compile self-contained logic sources directly (SentinelCore is an
      # xpc-service, so @testable import is not available to a logic bundle).
      - path: Sources/SentinelCore/BlinkAPIClient.swift
      - path: Sources/SentinelCore/RecordingEngine.swift
      - path: Sources/SentinelCore/EncryptionManager.swift
      - path: Sources/SentinelCore/DatabaseManager.swift
      - path: Sources/Shared/Models.swift
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_NAME: McBlinkTests
        PRODUCT_BUNDLE_IDENTIFIER: com.heyfinal.mcblink.tests
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  McBlink:
    build:
      targets:
        McBlinkApp: all
        SentinelCore: all
        SentinelWatchdog: all
    run:
      config: Debug
      executable: McBlinkApp
    test:
      config: Debug
      targets:
        - McBlinkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
